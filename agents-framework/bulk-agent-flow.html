<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulk content optimizer — flow prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: rgba(0, 0, 0, 0.87);
      --muted: rgba(0, 0, 0, 0.6);
      --dim: rgba(0, 0, 0, 0.38);
      --line: #e3e7ea;
      --line-strong: #cfd6db;
      --paper: #ececec;
      --panel-bg: #f5f5f5;
      --header: #0f4c5c;
      --header-ink: #e8f2f4;
      --accent: #0d71af;
      --high: #307932;
      --mid: #e06c00;
      --low: #b00020;
      --select: #d7ebf7;
      --h-global-header: 48px;
      --h-action-toolbar: 44px;
      --h-tabs-row: 41px;
      --h-crumbs: 37px;
      --h-context-band: calc(var(--h-tabs-row) + var(--h-crumbs));
      font-family: "Noto Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 21px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; min-width: 1200px; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .app { height: 100%; display: flex; flex-direction: column; background: var(--paper); }

    .mdm-header {
      display: flex; align-items: center; gap: 12px; box-sizing: border-box;
      height: var(--h-global-header); min-height: var(--h-global-header); max-height: var(--h-global-header);
      padding: 0 16px; background: var(--header); color: var(--header-ink); flex-shrink: 0;
      overflow: hidden;
    }
    .mdm-header svg { color: var(--header-ink); flex-shrink: 0; }
    .brand-mark { width: 22px; height: 22px; background: #1fa394; border-radius: 3px; flex-shrink: 0; }
    .brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: 8px; min-width: 0; }
    .brand b { font-size: 13px; font-weight: 600; }
    .brand span { font-size: 11px; opacity: 0.75; }
    .lang, .nav-link { font-size: 12px; color: var(--header-ink); text-decoration: none; opacity: 0.9; }
    .search {
      display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.12);
      border-radius: 4px; padding: 0 10px; height: 30px; flex: 1; max-width: 420px; margin-left: 16px;
    }
    .search input { border: 0; background: transparent; color: #fff; width: 100%; outline: none; font-size: 12px; }
    .search input::placeholder { color: rgba(255,255,255,0.6); }
    .ai-assistant {
      margin-left: auto; background: #1a7a6d; color: #fff; border: 0; border-radius: 4px;
      padding: 7px 12px; font-weight: 600; font-size: 12px; white-space: nowrap;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 0 14px rgba(46, 196, 171, 0.45);
    }
    .assistant-back {
      display: flex; align-items: center; gap: 4px; border: 0; background: transparent;
      color: var(--header-ink); font-size: 13px; font-weight: 600; padding: 4px 0; margin-right: 4px;
    }
    .assistant-back:hover { opacity: 0.92; }
    .assistant-back svg { opacity: 0.95; }
    .icon-btn {
      border: 0; background: transparent; color: inherit; width: 28px; height: 28px;
      display: grid; place-items: center; border-radius: 4px; position: relative; padding: 0;
    }
    .icon-btn.light { color: var(--header-ink); }
    .icon-btn.light:hover { background: rgba(255,255,255,0.12); }
    .icon-btn .badge {
      position: absolute; top: 2px; right: 1px; background: #2b8aed; color: #fff;
      font-size: 9px; font-weight: 700; min-width: 14px; height: 14px; border-radius: 99px;
      display: grid; place-items: center; line-height: 1;
    }
    .avatar {
      width: 26px; height: 26px; border-radius: 99px; background: #c8a46a; color: #1c2429;
      display: grid; place-items: center; font-size: 10px; font-weight: 700; flex-shrink: 0;
    }
    .spacer { flex: 1; }

    .toolbar {
      display: flex; align-items: center; gap: 4px; box-sizing: border-box;
      height: var(--h-action-toolbar); min-height: var(--h-action-toolbar); max-height: var(--h-action-toolbar);
      padding: 0 12px; background: #fff; border-bottom: 1px solid var(--line); flex-shrink: 0; position: relative;
    }
    .tool {
      display: flex; align-items: center; gap: 6px; border: 0; background: transparent;
      color: #3d4a51; padding: 6px 8px; border-radius: 4px; font-size: 12px;
    }
    .tool:hover { background: #f4f6f7; }
    .tool.is-on { background: #e8f3fb; color: var(--accent); font-weight: 600; }
    .tool svg { flex-shrink: 0; }
    .zoom { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-left: 8px; }
    .zoom input { width: 88px; accent-color: var(--header); }
    .details-btn {
      background: var(--header); color: #fff; border: 0; border-radius: 4px;
      padding: 6px 12px; font-size: 12px; font-weight: 600;
    }
    .menu-pop {
      position: absolute; top: calc(100% + 2px); left: 140px; z-index: 30;
      min-width: 220px; background: #fff; border: 1px solid var(--line-strong);
      border-radius: 2px; box-shadow: 0 8px 24px rgba(16,24,32,0.12); padding: 4px 0;
    }
    .menu-pop button {
      width: 100%; text-align: left; padding: 10px 14px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .menu-pop button:hover { background: #e8f3fb; color: var(--accent); }
    .menu-pop button.is-active { background: #e8f3fb; color: var(--accent); font-weight: 600; }
    .menu-pop button b { font-weight: 600; }
    .menu-pop.group-menu { left: 200px; min-width: 260px; }
    .menu-pop-divider { height: 1px; background: var(--line); margin: 4px 0; }
    .menu-pop button:disabled { opacity: 0.45; cursor: not-allowed; }

    .context-band {
      flex-shrink: 0; display: flex; flex-direction: column; box-sizing: border-box;
      height: var(--h-context-band); min-height: var(--h-context-band); max-height: var(--h-context-band);
    }
    .tabs-row {
      display: flex; align-items: flex-end; gap: 0; box-sizing: border-box;
      height: var(--h-tabs-row); min-height: var(--h-tabs-row); max-height: var(--h-tabs-row);
      background: #e8ecee; padding: 8px 12px 0; flex-shrink: 0;
    }
    .tabs-row--placeholder { pointer-events: none; visibility: hidden; }
    .tab {
      border: 1px solid transparent; background: transparent; padding: 8px 16px;
      color: var(--muted); border-radius: 6px 6px 0 0; font-size: 12px;
    }
    .tab.is-on { background: #fff; border-color: var(--line); color: var(--ink); font-weight: 600; border-bottom-color: #fff; }
    .tab-inner { display: inline-flex; align-items: center; gap: 6px; }
    .tab-star { color: #f9a825; display: grid; place-items: center; }
    .crumbs {
      display: flex; align-items: center; box-sizing: border-box;
      height: var(--h-crumbs); min-height: var(--h-crumbs); max-height: var(--h-crumbs);
      padding: 0 20px; font-size: 12px; color: var(--muted); background: #fff;
      border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .crumbs a { color: var(--accent); text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }

    .workspace-row {
      flex: 1; min-height: 0; display: flex; align-items: stretch;
    }
    .workspace-main {
      flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #fff;
    }
    .main-col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #fff; }

    .screen-review { background: #fff; }
    .review-screen { background: #fff; }

    .table-wrap { flex: 1; min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      position: sticky; top: 0; z-index: 2; background: #fafbfc; text-align: left;
      font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line);
      padding: 10px 12px; white-space: nowrap;
    }
    td { border-bottom: 1px solid var(--line); padding: 10px 12px; vertical-align: top; }
    tr.is-selected td { background: var(--select); }
    tr.is-reviewed td { background: #fafafa; }
    tr.group-row td {
      background: #eef1f3; padding: 8px 12px; border-bottom: 1px solid var(--line);
      font-size: 12px; color: var(--muted);
    }
    tr.group-row strong { color: var(--ink); font-weight: 600; font-size: 13px; }
    tr.group-row .group-meta { font-weight: 400; margin-left: 8px; }
    td.is-grouped-empty { color: var(--dim); }
    .cell-check { width: 40px; text-align: center; }
    .cell-check input { width: 16px; height: 16px; accent-color: var(--accent); }
    .item-cell { display: flex; align-items: center; gap: 8px; min-width: 160px; }
    .folder { width: 18px; height: 14px; background: #90a4ae; border-radius: 2px 2px 0 0; flex-shrink: 0; position: relative; }
    .folder::after {
      content: ""; position: absolute; top: -3px; left: 0; width: 8px; height: 4px;
      background: #90a4ae; border-radius: 2px 2px 0 0;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; background: #eceff1;
      border-radius: 2px; padding: 2px 6px; font-size: 12px; margin: 2px 4px 2px 0;
    }
    .chip .star { color: #f9a825; font-size: 10px; }
    .table-status {
      flex-shrink: 0; display: flex; align-items: center; min-height: 40px;
      padding: 8px 16px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--line); background: #f8fafc;
    }
    .review-finish-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 12px 16px; background: #fff; border-top: 1px solid var(--line);
    }
    .review-finish-progress { flex: 1; min-width: 0; max-width: 420px; }
    .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .progress-label strong { color: var(--ink); font-weight: 600; font-size: 14px; margin-right: 4px; }
    .progress-bar { height: 6px; background: #e0e0e0; border-radius: 99px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; background: var(--accent); transition: width 0.2s; }
    .finish-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .btn-finish {
      background: var(--accent); color: #fff; border: 0; border-radius: 2px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
    }
    .btn-finish:not(:disabled):hover { filter: brightness(1.05); }

    .score {
      display: inline-block; min-width: 44px; text-align: center; padding: 0 8px; height: 20px;
      line-height: 20px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 600;
    }
    .score.high { background: var(--high); }
    .score.mid { background: var(--mid); }
    .score.low { background: var(--low); }
    .status { font-size: 12px; color: var(--muted); }
    .status.approved { color: var(--high); font-weight: 600; }
    .status.rejected { color: var(--low); font-weight: 600; }
    .value-col { max-width: 220px; line-height: 1.4; }
    .desc-col { max-width: 280px; line-height: 1.4; color: var(--ink); }
    .tag-col { max-width: 200px; }
    .reasoning { max-width: 260px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .record-status { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* Side panel — no close control */
    .panel {
      width: 384px; flex-shrink: 0; align-self: stretch; background: var(--panel-bg);
      border-left: 1px solid var(--line-strong); display: flex; flex-direction: column;
      min-height: 0; height: auto;
    }
    .panel[hidden] { display: none; }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 24px 24px 0; flex-shrink: 0;
    }
    .panel-title { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 500; }
    .panel-rule { height: 1px; background: #cfd8dc; margin: 16px 24px 0; }
    .panel-run-row { display: flex; justify-content: flex-end; padding: 16px 24px 0; }
    .run-chip {
      background: #eceff1; color: var(--muted); border-radius: 2px; padding: 6px 12px;
      font-size: 12px; font-weight: 600;
    }
    .panel-feed {
      flex: 1; min-height: 0; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px;
    }
    .panel-empty {
      flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0;
    }
    .panel-empty-hero {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 16px 8px 24px; gap: 12px;
    }
    .panel-empty-icon { color: var(--accent); line-height: 0; }
    .panel-empty-icon svg { width: 48px; height: 48px; }
    .panel-empty-hero h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
    .panel-empty-hero p {
      margin: 0; max-width: 280px; font-size: 13px; line-height: 1.45; color: var(--muted);
    }
    .panel-empty-run { font-size: 14px; margin-top: 4px; }
    .panel-empty-run:disabled { opacity: 0.45; cursor: not-allowed; text-decoration: none; }
    .panel-idle-thread { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .panel-thread-archive {
      padding: 8px 10px; background: #eceff1; border-radius: 2px; font-size: 12px; color: var(--muted);
    }
    .panel-thread-archive strong { color: var(--ink); font-weight: 600; }
    .single-summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .single-summary-table th {
      position: static; text-align: left; font-weight: 600; color: var(--muted); font-size: 12px;
      padding: 6px 8px; border-bottom: 1px solid var(--line); background: transparent;
    }
    .single-summary-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .single-attr-name { color: var(--accent); font-weight: 500; }
    .single-attr-toggle {
      width: 100%; display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent;
      text-align: left; font: inherit; color: inherit;
    }
    .single-attr-toggle .chev { font-size: 10px; color: var(--muted); width: 12px; }
    .single-attr-detail { padding: 8px 8px 10px 26px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .single-attr-detail b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; font-size: 12px; }
    .single-asking {
      display: flex; align-items: center; gap: 8px; padding: 10px 8px 0; font-size: 13px; color: var(--muted);
    }
    .panel-turn-relative { position: relative; }
    .single-questions {
      margin-top: 12px; background: #fff; border: 1px solid var(--line-strong); border-radius: 4px;
      box-shadow: 0 8px 20px rgba(16, 24, 32, 0.12); padding: 14px 14px 12px;
    }
    .single-questions--frozen { box-shadow: none; background: #fafafa; }
    .single-questions--frozen .single-q-option { pointer-events: none; opacity: 0.55; }
    .single-questions--frozen .single-q-option.is-chosen { opacity: 1; }
    .single-questions--frozen .single-questions-foot { display: none; }
    .single-manual-record {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;
    }
    .single-manual-record:last-child { border-bottom: 0; }
    .single-manual-log { margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; background: #fff; }
    .single-manual-log > strong { display: block; font-size: 13px; margin-bottom: 8px; }
    .single-questions > strong { display: block; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .single-q-option {
      display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border: 0; background: transparent;
      width: 100%; text-align: left; font: inherit; cursor: pointer;
    }
    .single-q-option input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
    .single-q-option b { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
    .single-q-option span { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    .single-questions-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--line);
    }
    .single-questions-foot .link-discard {
      border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; padding: 6px 0;
    }
    .single-questions-foot .actions { display: flex; gap: 8px; margin-left: auto; }
    .btn-refine-secondary {
      border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 2px;
      padding: 6px 12px; font-size: 13px; font-weight: 600;
    }
    .btn-refine-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-single-primary {
      background: var(--accent); color: #fff; border: 0; border-radius: 2px;
      padding: 6px 14px; font-size: 13px; font-weight: 600;
    }
    .btn-single-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .single-manual {
      margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 14px; background: #fff;
    }
    .single-manual-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .single-manual h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .single-manual-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .single-manual-actions .tool { border: 1px solid var(--line); border-radius: 2px; padding: 6px 12px; font-size: 12px; font-weight: 600; }
    .single-finished .panel-lede { margin-top: 4px; }
    .panel-lede { margin: 0; font-size: 14px; }
    .work-toggle {
      display: flex; align-items: center; gap: 4px; padding: 0; color: var(--muted); font-size: 14px;
    }
    .work-toggle.is-live {
      background: linear-gradient(21.75deg, #07528d 6.42%, #931179 58.07%, #ec8b04 109.72%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-weight: 500;
    }
    .steps { list-style: none; margin: 8px 0 0; padding: 0 0 0 22px; border-left: 1px solid #d4d4d4; }
    .steps li { position: relative; padding: 0 0 8px 12px; color: var(--dim); font-size: 14px; }
    .steps li.is-now { color: var(--muted); }
    .steps li.is-done { color: var(--dim); }

    .summary {
      border: 1px solid #d4d4d4; border-radius: 2px; background: var(--panel-bg); overflow: hidden;
    }
    .summary-head {
      width: 100%; display: flex; justify-content: space-between; align-items: flex-start;
      padding: 8px 12px; text-align: left;
    }
    .summary-head strong { display: block; font-size: 16px; font-weight: 500; }
    .summary-head em { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
    .summary-body { padding: 0 12px 12px; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;
    }
    .stat {
      display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: var(--muted);
    }
    .stat b { display: block; font-size: 20px; font-weight: 500; color: var(--ink); line-height: 1.2; }
    .stat-icon { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; font-size: 14px; }
    .stat-icon.blue { background: #e3f2fd; }
    .stat-icon.purple { background: #f3e5f5; }
    .stat-icon.green { background: #e8f5e9; }
    .stat-icon.red { background: #ffebee; }
    .btn-review {
      align-self: flex-end; margin-top: 8px; background: var(--accent); color: #fff;
      border-radius: 2px; padding: 8px 16px; font-size: 13px; font-weight: 600;
    }
    .btn-review.is-muted {
      background: #eceff1; color: var(--muted); pointer-events: none;
    }
    .panel-user {
      align-self: flex-end; max-width: calc(100% - 16px); background: #e5e5e5;
      padding: 8px; border-radius: 2px; font-size: 14px;
    }
    .panel-dock {
      flex-shrink: 0; padding: 0 24px 24px; background: var(--panel-bg);
      border-top: 1px solid transparent;
    }
    .dock-input {
      display: flex; gap: 8px; align-items: flex-end; background: #fff; border: 1px solid #cfd8dc;
      border-radius: 2px; padding: 8px 10px;
    }
    .dock-input-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .dock-selection-chip {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 4px;
      background: #eceff1; border-radius: 2px; padding: 2px 8px; font-size: 12px; line-height: 18px;
      color: var(--ink);
    }
    .dock-selection-chip .star { color: #f9a825; font-size: 10px; }
    .dock-input textarea {
      width: 100%; border: 0; resize: none; min-height: 44px; max-height: 120px; outline: none;
      font-size: 14px; line-height: 21px;
    }
    .dock-send {
      width: 32px; height: 32px; border-radius: 2px; background: #eceff1; color: var(--muted);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .dock-send:not(:disabled) { background: var(--accent); color: #fff; }

    function isSinglePanelPhase() {
      return (
        state.runMode === "single" &&
        ["singleAsking", "singleQuestions", "singleManual", "singleComplete"].includes(state.panelPhase)
      );
    }

    function canRefineInPanel() {
      if (state.activeRefine) return false;
      if (isSinglePanelPhase() && state.panelPhase !== "singleComplete") {
        return pendingSuggestions().length > 0;
      }
      if (state.reviewSelected.size === 0) return false;
      return state.view === "review" && state.panelPhase === "reviewing";
    }

    function archiveSingleThreadIfNeeded() {
      if (state.runMode !== "single" || !suggestions.length) return;
      const applied = suggestions.filter((s) => s.status === "approved").length;
      state.singleThreads.push({
        product: suggestions[0]?.item || "Product",
        attributeCount: suggestions.length,
        applied,
        finished: state.panelPhase === "singleComplete",
      });
    }

    function canChatWhilePaused() {
      return state.panelPhase === "reviewPaused" && !state.activeRefine;
    }

    function isRunCommand(text) {
      const t = text.trim().toLowerCase();
      return t === "run" || t === "run agent";
    }

    function canSendPanelMessage() {
      if (state.activeRefine) return false;
      if (state.panelPhase === "idle") return state.chatDraft.trim().length > 0;
      if (isSinglePanelPhase() && state.panelPhase !== "singleComplete") {
        return state.chatDraft.trim().length > 0 && pendingSuggestions().length > 0;
      }
      return canRefineInPanel() || canChatWhilePaused();
    }

    function toggleAssistantPanel() {
      if (state.view !== "catalog") return;
      state.panelOpen = !state.panelOpen;
      if (state.panelOpen) state.keepChatFocus = true;

    function scoreClass(score) {
      if (score >= HIGH) return "high";
      if (score >= 70) return "mid";
      return "low";

    function buildSuggestions(selectedIds) {
      const out = [];
      selectedIds.forEach((id) => {
        const row = CATALOG_ROWS.find((r) => r.id === id);
        if (!row) return;
        const edits = PRODUCT_EDITS[id];
        if (!edits?.length) {
          out.push({
            id: "s" + (out.length + 1),
            item: row.name,
            attribute: "Short description",
            previous: row.shortDesc,
            newValue: row.shortDesc.replace(/\.$/, "") + ", enriched for channel-ready copy.",
            score: 90,
            reasoning: "Light polish of existing short description.",
            status: "pending",
          });
          return;
        }
        edits.forEach((edit) => {
          out.push({
            id: "s" + (out.length + 1),
            item: row.name,
            attribute: edit.attribute,
            previous: edit.previous,
            newValue: edit.newValue,
            score: edit.score,
            reasoning: edit.reasoning,
            status: "pending",
          });
        });
      });
      return out;
    }

      const attention = suggestions.filter((s) => s.status === "pending" && s.score < HIGH).length;
      return { total, pending, reviewed, ready, attention };
