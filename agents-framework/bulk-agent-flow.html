    }
    function svgHex() {
      return '<svg width="16" height="16" viewBox="0 0 36 36" fill="none" aria-hidden><path d="M18 3.5 30.5 10.5v15L18 32.5 5.5 25.5v-15L18 3.5Z" stroke="currentColor" stroke-width="1.4"/><path d="M18 11.5 19.5 16.2 24.2 17.8 19.5 19.4 18 24.1 16.5 19.4 11.8 17.8 16.5 16.2 18 11.5Z" fill="currentColor"/></svg>';
    }
    function svgCheck() {
      return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden><path d="M3.5 8.2 6.4 11.2 12.5 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function svgX() {
      return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
    }
    function svgSend() {
      return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l18-7-7 18-2-7-9-4z"/></svg>';
    }

    function renderHeaderUtilities() {
      return `
        <button type="button" class="icon-btn light" aria-label="Notifications">${svgBell()}<span class="badge">2</span></button>
        <button type="button" class="icon-btn light" aria-label="Apps">${svgGrid()}</button>
        <button type="button" class="icon-btn light" aria-label="Help">${svgHelp()}</button>
        <div class="avatar" aria-hidden="true">JS</div>
        <button type="button" class="icon-btn light" aria-label="Settings">${svgGear()}</button>`;
    }

    function renderCatalogHeader() {
      return `
        <header class="mdm-header">
          <div class="brand-mark" aria-hidden="true"></div>
          ${svgFolder()}
          <div class="brand"><b>Summer collection 2026</b><span>Nothing to save.</span></div>
          <span class="lang">English (US)</span>
          <a class="nav-link" href="#">Main</a>
          <label class="search">${svgSearch()}<input placeholder="Search" /></label>
          <button type="button" class="ai-assistant" data-action="open-assistant">+ AI assistant</button>
          ${renderHeaderUtilities()}
        </header>`;
    }

    function renderReviewHeader() {
      return `
        <header class="mdm-header">
          <button type="button" class="assistant-back" data-action="back-catalog">${svgBack()} AI assistant</button>
          <span class="lang">English (US)</span>
          <a class="nav-link" href="#">Main</a>
          <label class="search">${svgSearch()}<input placeholder="Search" /></label>
          <span class="spacer"></span>
          ${renderHeaderUtilities()}
        </header>`;
    }

    function svgChat() {
      return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden><path d="M3 3.8h10v7.4H6.3L3 13.4V3.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
    }
    function svgRunMark() {
      return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden class="panel-switch-run-icon"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>';
    }

    function runLogChanges() {
      if (state.writtenChanges.length) return state.writtenChanges;
      if (state.completedRun?.written?.length) return state.completedRun.written;
      return [];
    }

    function renderPanelMenu() {
      const run = state.completedRun || state.currentRun;
      const runRow = run
        ? `<button type="button" class="panel-switch-run" data-action="open-run-log">
            ${svgRunMark()}
            <span><strong>Run #${run.id}</strong><em>Content optimizer, ${run.at || "just now"}</em></span>
          </button>`
        : "";
      return `
        <div class="panel-switch" role="menu">
          <div class="panel-switch-chat" aria-disabled="true">${svgChat()} Chat</div>
          <div class="panel-switch-rule"></div>
          <div class="panel-switch-kicker">Agents</div>
          <button type="button" class="panel-switch-agent" data-action="close-panel-menu">
            <span class="panel-switch-agent-title">${svgHex()} Content optimizer</span>
            <p>${AGENT_PURPOSE}</p>
          </button>
          <div class="panel-switch-rule"></div>
          <div class="panel-switch-kicker">Agent runs</div>
          ${runRow || '<p class="panel-switch-kicker" style="padding-top:0">No runs yet</p>'}
        </div>`;
    }

    function renderSingleArchivedThreads() {
      return state.singleThreads
        .map(
          (t) => `
        <div class="panel-thread-archive">
          <strong>${escapeHtml(t.product)}</strong> · ${t.attributeCount} attribute${t.attributeCount === 1 ? "" : "s"}
          ${t.finished ? ` · ${t.applied} applied` : " · replaced by a new run"}
        </div>`
        )
        .join("");
    }

    function renderSingleAttributeRows() {
      const frozen = state.panelPhase === "singleComplete";
      return suggestions
        .map((s) => {
          const open = state.singleExpandedAttrs.has(s.id);
          const statusBadge =
            frozen && s.status === "approved"
              ? '<span class="status approved" style="margin-left:8px">Approved</span>'
              : frozen && s.status === "rejected"
                ? '<span class="status rejected" style="margin-left:8px">Rejected</span>'
                : "";
          return `
          <tr>
            <td colspan="2" style="padding:0;border:none">
              <button type="button" class="single-attr-toggle" data-action="toggle-single-attr" data-id="${s.id}" ${frozen ? "disabled style=\"cursor:default\"" : ""}>
                <span class="chev ${open ? "open" : ""}">▼</span>
                <span class="single-attr-name">${escapeHtml(s.attribute)}</span>
                <span class="score ${scoreClass(s.score)}" style="margin-left:auto">${s.score}%</span>
                ${statusBadge}
              </button>
              ${open ? `
                <div class="single-attr-detail">
                  <b>New value</b>
                  ${escapeHtml(s.newValue)}
                  <b style="margin-top:8px">Reasoning</b>
                  ${escapeHtml(s.reasoning)}
                </div>` : ""}
            </td>
          </tr>`;
        })
        .join("");
    }

    function renderSingleQuestionsFrozen() {
      const chosen =
        state.singleOutcome === "discard" ? "discard" : state.singleQuestionChoice || state.singleOutcome;
      const options = [
        { id: "all", title: "Accept suggestions and finish conversation", hint: "Apply every suggestion, including low-confidence matches." },
        { id: "high", title: "Accept high-confidence only", hint: "Ignore attributes scoring below 90% threshold." },
        { id: "manual", title: "Review suggestions manually", hint: "Step through each attribute before applying changes." },
      ];
      if (state.singleOutcome === "discard") {
        return `
          <div class="single-questions single-questions--frozen">
            <strong>Questions</strong>
            <p class="panel-lede" style="margin-top:8px">You chose to <b>discard all</b> suggestions.</p>
          </div>`;
      }
      return `
        <div class="single-questions single-questions--frozen">
          <strong>Questions</strong>
          ${options
            .map(
              (opt) => `
            <label class="single-q-option ${chosen === opt.id ? "is-chosen" : ""}">
              <input type="radio" name="single-q-frozen" ${chosen === opt.id ? "checked" : ""} disabled />
              <span><b>${opt.title}</b><span>${opt.hint}</span></span>
            </label>`
            )
            .join("")}
        </div>`;
    }

    function renderSingleManualHistory() {
      if (state.singleOutcome !== "manual") return "";
      const rows = suggestions
        .map(
          (s) => `
        <div class="single-manual-record">
          <span>${escapeHtml(s.attribute)}</span>
          ${
            s.status === "approved"
              ? '<span class="status approved">Approved</span>'
              : s.status === "rejected"
                ? '<span class="status rejected">Rejected</span>'
                : '<span class="status">Pending</span>'
          }
        </div>`
        )
        .join("");
      return `
        <div class="single-manual-log">
          <strong>Manual review</strong>
          ${rows}
        </div>`;
    }

    function renderSingleRunTurn() {
      const frozen = state.panelPhase === "singleComplete";
      const n = suggestions.length;
      const stepsHtml = RUN_STEPS.map((label) => `<li class="is-done">${label}</li>`).join("");
      const showQuestions = !frozen && state.panelPhase === "singleQuestions";
      const showQuestionsFrozen = frozen && state.singleOutcome;
      const asking =
        !frozen && state.panelPhase === "singleAsking"
          ? `<div class="single-asking"><span class="spinner"></span> Asking questions…</div>`
          : !frozen && state.panelPhase === "singleQuestions"
            ? `<div class="single-asking" style="color:var(--dim)">Asking questions…</div>`
            : frozen
              ? `<div class="single-asking" style="color:var(--dim)">Asking questions…</div>`
              : "";
      const choice = state.singleQuestionChoice;
      const primaryLabel = choice === "manual" ? "Next" : "Apply";
      const primaryDisabled = !choice;
      return `
        <div class="panel-turn panel-turn-relative">
          <button type="button" class="run-meta-toggle" data-action="toggle-run-steps">
            <span class="meta-left"><span>${RUN_STEPS.length} steps</span></span>
            <span class="meta-right">${RUN_DURATION_SEC} s <span class="chev ${state.runStepsOpen ? "open" : ""}">▼</span></span>
          </button>
          ${state.runStepsOpen ? `<ul class="steps">${stepsHtml}</ul>` : ""}
          <p class="panel-lede">Done. I generated ${n} attribute${n === 1 ? "" : "s"}. Review carefully the ones with low score:</p>
          <div class="summary">
            <button type="button" class="summary-head" data-action="toggle-summary">
              <span><strong>Summary</strong><em>${n} attribute${n === 1 ? "" : "s"} generated</em></span>
              <span class="chev ${state.summaryOpen ? "open" : ""}">▼</span>
            </button>
            ${state.summaryOpen ? `
              <div class="summary-body" style="padding-top:0">
                <table class="single-summary-table">
                  <thead><tr><th>Attribute name</th><th style="width:72px">Score</th></tr></thead>
                  <tbody>${renderSingleAttributeRows()}</tbody>
                </table>
                ${asking}
              </div>` : ""}
          </div>
          ${state.refineHistory.map((turn) => renderRefineExchange(turn)).join("")}
          ${showQuestions ? `
            <div class="single-questions" role="dialog" aria-labelledby="single-q-title">
              <strong id="single-q-title">Questions</strong>
              <label class="single-q-option">
                <input type="radio" name="single-q" data-action="set-single-choice" data-choice="all" ${choice === "all" ? "checked" : ""} />
                <span><b>Accept suggestions and finish conversation</b><span>Apply every suggestion, including low-confidence matches.</span></span>
              </label>
              <label class="single-q-option">
                <input type="radio" name="single-q" data-action="set-single-choice" data-choice="high" ${choice === "high" ? "checked" : ""} />
                <span><b>Accept high-confidence only</b><span>Ignore attributes scoring below 90% threshold.</span></span>
              </label>
              <label class="single-q-option">
                <input type="radio" name="single-q" data-action="set-single-choice" data-choice="manual" ${choice === "manual" ? "checked" : ""} />
                <span><b>Review suggestions manually</b><span>Step through each attribute before applying changes.</span></span>
              </label>
              <div class="single-questions-foot">
                <button type="button" class="link-discard" data-action="single-discard-all">Discard all</button>
                <div class="actions">
                  <button type="button" class="btn-refine-secondary" data-action="single-refine-focus" ${state.activeRefine ? "disabled" : ""}>Refine</button>
                  <button type="button" class="btn-single-primary" data-action="single-primary" ${primaryDisabled ? "disabled" : ""}>${primaryLabel}</button>
                </div>
              </div>
            </div>` : ""}
          ${showQuestionsFrozen ? renderSingleQuestionsFrozen() : ""}
          ${frozen ? renderSingleManualHistory() : ""}
          ${!frozen && state.panelPhase === "singleManual" ? renderSingleManualStep() : ""}
        </div>`;
    }

    function renderSingleManualStep() {
      const s = suggestions[state.singleManualIndex];
      if (!s) return "";
      const decided = s.status !== "pending";
      return `
        <div class="single-manual">
          <div class="single-manual-meta">Attribute ${state.singleManualIndex + 1} of ${suggestions.length}</div>
          <h3>${escapeHtml(s.attribute)}</h3>
          <span class="score ${scoreClass(s.score)}">${s.score}%</span>
          <div class="single-attr-detail" style="padding-left:0;margin-top:10px">
            <b>New value</b>
            ${escapeHtml(s.newValue)}
            <b style="margin-top:8px">Reasoning</b>
            ${escapeHtml(s.reasoning)}
          </div>
          <div class="single-manual-actions">
            <button type="button" class="tool" data-action="single-manual-decide" data-decision="approved">${svgCheck()} Approve</button>
            <button type="button" class="tool" data-action="single-manual-decide" data-decision="rejected">${svgX()} Reject</button>
            <button type="button" class="btn-single-primary" data-action="single-manual-next" ${decided ? "" : "disabled"}>Next</button>
          </div>
        </div>`;
    }

    function renderSingleCompleteNote() {
      const product = suggestions[0]?.item || state.currentRun?.product || "Product";
      const n = state.writtenChanges.length;
      return `
        <div class="panel-turn single-finished">
          <div class="work-toggle">Conversation finished</div>
          <p class="panel-lede">Done. ${n} change${n === 1 ? "" : "s"} applied to ${escapeHtml(product)}.</p>
          ${n ? `<button type="button" class="panel-link" data-action="open-run-log">View run log</button>` : ""}
        </div>`;
    }

    function renderRunResultTurn(total, reviewBtnLabel, reviewBtnMuted) {
      const stepsHtml = RUN_STEPS.map((label) => `<li class="is-done">${label}</li>`).join("");
      const btnClass = reviewBtnMuted ? "btn-review is-muted" : "btn-review";
      const btnAttrs = reviewBtnMuted ? "disabled" : 'data-action="open-review"';
      return `
        <div class="panel-turn">
          <button type="button" class="run-meta-toggle" data-action="toggle-run-steps">
            <span class="meta-left"><span>${RUN_STEPS.length} steps</span></span>
            <span class="meta-right">${RUN_DURATION_SEC} s <span class="chev ${state.runStepsOpen ? "open" : ""}">▼</span></span>
          </button>
          ${state.runStepsOpen ? `<ul class="steps">${stepsHtml}</ul>` : ""}
          <p class="panel-lede">Done. I made ${total} suggestions. Review carefully the ones with low score.</p>
          <div class="summary">
            <button type="button" class="summary-head" data-action="toggle-summary">
              <span><strong>Summary</strong><em>${total} suggestions</em></span>
              <span class="chev ${state.summaryOpen ? "open" : ""}">▼</span>
            </button>
            ${state.summaryOpen ? `
              <div class="summary-body">
                Approve, reject them or write instructions to send them back to the agent. Once everything is reviewed, you can finish and attributes will be enriched.
                <div class="stat-grid">
                  <div class="stat"><span class="stat-icon blue">🔍</span><span><b>${state.lastAnalyzedCount}</b> items analyzed</span></div>
                  <div class="stat"><span class="stat-icon purple">✦</span><span><b>${total}</b> suggestions</span></div>
                  <div class="stat"><span class="stat-icon green">✓</span><span><b>${state.completedRun?.ready ?? stats().ready}</b> ready</span></div>
                  <div class="stat"><span class="stat-icon red">!</span><span><b>${state.completedRun?.attention ?? stats().attention}</b> need attention</span></div>
                </div>
              </div>` : ""}
          </div>
          <button type="button" class="${btnClass}" ${btnAttrs}>${reviewBtnLabel}</button>
        </div>`;
    }

    function pauseDetailText() {
      const st = stats();
      return st.pending === 0
        ? "All suggestions are decided. Continue to finish the review and write approved changes."
        : `${st.reviewed} of ${st.total} reviewed · ${st.pending} still pending. Pick up where you left off.`;
    }

    function renderReviewSessionMark(mark) {
      const labels = {
        started: "Review started",
        paused: "Review paused",
        resumed: "Review resumed",
      };
      const label = labels[mark.type] || mark.type;
      const detail = mark.detail
        ? `<p class="panel-lede">${escapeHtml(mark.detail)}</p>`
        : "";
      return `
        <div class="panel-turn">
          <div class="work-toggle">${label}</div>
          ${detail}
        </div>`;
    }

    function renderReviewSessionTimeline() {
      const marks = [...state.reviewSessionMarks].sort(
        (a, b) => a.afterRefineIndex - b.afterRefineIndex
      );
      let html = "";
      let refineIdx = 0;
      for (const mark of marks) {
        while (refineIdx < mark.afterRefineIndex && refineIdx < state.refineHistory.length) {
          html += renderRefineExchange(state.refineHistory[refineIdx]);
          refineIdx++;
        }
        html += renderReviewSessionMark(mark);
      }
      while (refineIdx < state.refineHistory.length) {
        html += renderRefineExchange(state.refineHistory[refineIdx]);
        refineIdx++;
      }
      return html;
    }

    function renderRefineExchange(turn) {
      return `
        <div class="panel-user">${escapeHtml(turn.prompt)}</div>
        <p class="panel-lede">${escapeHtml(turn.reply)}</p>`;
    }

    function renderActiveRefine(active) {
      const stepsHtml = REFINE_STEPS.map((label, idx) => {
        const cls = idx < active.step ? "is-done" : idx === active.step ? "is-now" : "";
        return `<li class="${cls}">${label}</li>`;
      }).join("");
      return `
        <div class="panel-user">${escapeHtml(active.prompt)}</div>
        <button type="button" class="work-toggle is-live" disabled>
          <span class="spinner"></span> Working…
        </button>
        <ul class="steps">${stepsHtml}</ul>`;
    }

    function renderReviewFinishedNote(writtenCount) {
      return `
        <div class="panel-turn">
          <div class="work-toggle">Review finished</div>
          <p class="panel-lede">Done. ${writtenCount} change${writtenCount === 1 ? "" : "s"} were written.</p>
          <button type="button" class="panel-link" data-action="open-run-log">View run log</button>
        </div>`;
    }

    function renderRunLogModal() {
      if (!state.runLogOpen) return "";
      const run = state.completedRun || state.currentRun || { id: DEMO_RUN_ID };
      const changes = runLogChanges();
      const rows = changes.length
        ? changes.map((c) => `
            <tr>
              <td>${escapeHtml(c.item)}</td>
              <td>${escapeHtml(c.attribute)}</td>
              <td class="value-col">${escapeHtml(c.previous) || "—"}</td>
              <td class="value-col">${escapeHtml(c.newValue)}</td>
              <td><span class="log-decision approved">Written</span></td>
            </tr>`).join("")
        : `<tr><td colspan="5" style="color:var(--muted);padding:16px 0">No written changes for this run.</td></tr>`;
      return `
        <div class="modal-scrim" data-action="close-run-log-scrim" role="presentation">
          <div class="modal" role="dialog" aria-labelledby="run-log-title" aria-modal="true" data-action="stop">
            <div class="modal-head">
              <div>
                <h2 id="run-log-title">Run #${run.id} · Content optimizer</h2>
                <p>${changes.length} attribute change${changes.length === 1 ? "" : "s"} written to STEP</p>
              </div>
              <button type="button" class="modal-close" data-action="close-run-log" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
              <table>
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Attribute</th>
                    <th>Previous value</th>
                    <th>New value</th>
                    <th>Outcome</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            <div class="modal-foot">
              <button type="button" data-action="close-run-log">Close</button>
            </div>
          </div>
        </div>`;
    }

    function renderPanelIdleEmptyState() {
      const canRun = state.catalogSelected.size > 0;
      const thread = state.idleChatLog
        .map(
          (turn) => `
        <div class="panel-idle-thread">
          <div class="panel-user">${escapeHtml(turn.prompt)}</div>
          <p class="panel-lede">${escapeHtml(turn.reply)}</p>
        </div>`
        )
        .join("");
      return `
        <div class="panel-empty">
          ${thread}
          <div class="panel-empty-hero">
            <div class="panel-empty-icon">${svgHex()}</div>
            <h2>Content optimizer</h2>
            <p>${escapeHtml(AGENT_PURPOSE)}</p>
            <button type="button" class="panel-link panel-empty-run" data-action="run-agent" ${canRun ? "" : "disabled"}>Run agent</button>
          </div>
        </div>`;
    }

    function renderPanel() {
      if (!state.panelOpen) return "";
      const st = stats();
      const snapshot = state.completedRun;
      const totalSuggestions = snapshot?.total ?? st.total;
      const canChat = canSendPanelMessage();

      let feed = renderSingleArchivedThreads();

      if (state.panelPhase === "idle") {
        feed += renderPanelIdleEmptyState();
      }

      if (state.panelPhase === "working") {
        const stepsHtml = RUN_STEPS.map((label, idx) => {
          const cls = idx < state.runStep ? "is-done" : idx === state.runStep ? "is-now" : "";
          return `<li class="${cls}">${label}</li>`;
        }).join("");
        feed += `
          <button type="button" class="work-toggle is-live" disabled>
            <span class="spinner"></span> Working…
          </button>
          <ul class="steps">${stepsHtml}</ul>`;
      }

      if (state.panelPhase === "done" && state.runMode === "bulk") {
        feed += renderRunResultTurn(totalSuggestions, "Review", false);
      }

      if (
        state.runMode === "single" &&
        ["singleAsking", "singleQuestions", "singleManual", "singleComplete"].includes(state.panelPhase)
      ) {
        feed += renderSingleRunTurn();
        if (state.activeRefine) {
          feed += renderActiveRefine(state.activeRefine);
        }
        if (state.panelPhase === "singleComplete") {
          feed += renderSingleCompleteNote();
        }
      }

      if (state.panelPhase === "reviewing" || state.panelPhase === "reviewPaused") {
        const reviewBtnLabel = state.panelPhase === "reviewPaused" ? "Continue review" : "Reviewing";
        const reviewBtnMuted = state.panelPhase === "reviewing";
        feed += renderRunResultTurn(totalSuggestions, reviewBtnLabel, reviewBtnMuted);
        feed += renderReviewSessionTimeline();
        if (state.activeRefine) {
          feed += renderActiveRefine(state.activeRefine);
        }
      }

      if (state.panelPhase === "complete" && snapshot && state.runMode === "bulk") {
        feed += renderRunResultTurn(snapshot.total, "Reviewed", true);
        feed += renderReviewFinishedNote(snapshot.approvedCount);
      }

      const runDisabled =
        (state.panelPhase !== "idle" && state.panelPhase !== "singleComplete") ||
        state.catalogSelected.size === 0;
      const reviewSelCount = state.reviewSelected.size;
      const showSelectionChip =
        state.view === "review" && reviewSelCount > 0 && state.panelPhase !== "working";
      const selectionChipLabel =
        reviewSelCount === 1 ? "1 selected" : reviewSelCount + " selected";

      return `
        <aside class="panel">
          <div class="panel-head">
            <div class="panel-title-wrap">
              <button type="button" class="panel-icon-btn${state.panelMenuOpen ? " is-on" : ""}" data-action="toggle-panel-menu" aria-label="Open menu" aria-expanded="${state.panelMenuOpen}">${svgMore()}</button>
              ${state.panelMenuOpen ? renderPanelMenu() : ""}
              <div class="panel-title">${svgHex()} Content optimizer</div>
            </div>
          </div>
          <div class="panel-rule"></div>
          ${state.panelPhase !== "idle" ? `
          <div class="panel-run-row">
            <button type="button" class="run-chip" data-action="run-agent" ${runDisabled ? "disabled" : ""}>Run agent</button>
          </div>` : ""}
          <div class="panel-feed">${feed}</div>
          <div class="panel-dock">
            <div class="dock-input">
              <div class="dock-input-body">
                ${showSelectionChip ? `<span class="dock-selection-chip" aria-live="polite"><span class="star">★</span> ${selectionChipLabel} <span class="star">★</span></span>` : ""}
                <textarea id="chat-input" rows="2" placeholder="Ask me anything about data and NEW UI…">${escapeHtml(state.chatDraft)}</textarea>
              </div>
              <button type="button" class="dock-send" data-action="send-panel-message" ${canChat ? "" : "disabled"} title="Send message">${svgSend()}</button>
            </div>
            <div class="dock-meta"><span class="ai-pill">AI</span> Uses AI. Verify results.</div>
          </div>
        </aside>`;
    }

    function pendingSuggestions() {
      return suggestions.filter((s) => s.status === "pending");
    }

    function catalogSelectAllState() {
      const total = CATALOG_ROWS.length;
      const selected = state.catalogSelected.size;
      return {
        all: total > 0 && selected === total,
        some: selected > 0 && selected < total,
      };
    }

    function reviewSelectAllState() {
      const all = suggestions;
      if (!all.length) return { all: false, some: false, disabled: true };
      const selectedCount = all.filter((s) => state.reviewSelected.has(s.id)).length;
      return {
        all: selectedCount === all.length,
        some: selectedCount > 0 && selectedCount < all.length,
        disabled: false,
      };
    }

    function syncSelectAllCheckboxes() {
      const catalogAll = document.querySelector("[data-action=select-all-catalog]");
      if (catalogAll) {
        const { all, some } = catalogSelectAllState();
        catalogAll.checked = all;
        catalogAll.indeterminate = some;
      }
      const reviewAll = document.querySelector("[data-action=select-all-review]");
      if (reviewAll) {
        const { all, some, disabled } = reviewSelectAllState();
        reviewAll.disabled = disabled;
        reviewAll.checked = all;
        reviewAll.indeterminate = some;
      }
    }

    function renderCatalogTable() {
      const sel = state.catalogSelected;
      const { all: allCatalog } = catalogSelectAllState();
      const rows = CATALOG_ROWS.map((row) => {
        const checked = sel.has(row.id);
        return `
          <tr class="${checked ? "is-selected" : ""}" data-row-id="${row.id}">
            <td class="cell-check"><input type="checkbox" data-action="toggle-catalog" data-id="${row.id}" ${checked ? "checked" : ""} /></td>
            <td><div class="item-cell"><span class="folder"></span>${escapeHtml(row.name)}</div></td>
            <td>${escapeHtml(row.webName)}</td>
            <td class="desc-col">${escapeHtml(row.shortDesc)}</td>
            <td class="tag-col">${renderTagChips(row.tags)}</td>
            <td>${escapeHtml(row.category)}</td>
            <td>${escapeHtml(row.sku)}</td>
            <td class="record-status">${escapeHtml(row.recordStatus)}</td>
          </tr>`;
      }).join("");
      const headerCells = CATALOG_HEADERS.map((h) => `<th>${escapeHtml(h)}</th>`).join("");
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="cell-check">
                  <input type="checkbox" data-action="select-all-catalog" aria-label="Select all rows" ${allCatalog ? "checked" : ""} />
                </th>
                ${headerCells}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <footer class="table-status">${CATALOG_ROWS.length} items, ${sel.size} selected</footer>`;
    }

    function scoreBucket(score) {
      if (score >= HIGH) return "high";
      if (score >= 70) return "mid";
      return "low";
    }

    function reviewGroupKey(s, mode) {
      if (mode === "item") return s.item;
      if (mode === "attribute") return s.attribute;
      if (mode === "status") return s.status;
      if (mode === "score") return scoreBucket(s.score);
      return "";
    }

    function reviewGroupTitle(key, mode) {
      if (mode === "item") return key;
      if (mode === "attribute") return key;
      if (mode === "status") {
        if (key === "approved") return "Approved";
        if (key === "rejected") return "Rejected";
        return "Pending";
      }
      if (mode === "score") {
        if (key === "high") return "High confidence (90%+)";
        if (key === "mid") return "Medium confidence (70–89%)";
        return "Needs attention (<70%)";
      }
      return key;
    }

    function suggestionsInReviewGroup(groupKey) {
      const mode = state.reviewGroup;
      if (!mode) return [];
      return suggestions.filter((s) => reviewGroupKey(s, mode) === groupKey);
    }

    function sortReviewGroupKeys(keys, mode) {
      if (mode === "score") {
        const order = { high: 0, mid: 1, low: 2 };
        return keys.sort((a, b) => (order[a] ?? 9) - (order[b] ?? 9));
      }
      if (mode === "status") {
        const order = { pending: 0, approved: 1, rejected: 2 };
        return keys.sort((a, b) => (order[a] ?? 9) - (order[b] ?? 9));
      }
      return keys.sort((a, b) => String(a).localeCompare(String(b)));
    }

    function renderReviewSuggestionRow(s, sel, opts = {}) {
      const { hideItem = false, hideAttribute = false, hideScore = false, hideStatus = false } = opts;
      const checked = sel.has(s.id);
      const rowCls = [checked ? "is-selected" : "", s.status !== "pending" ? "is-reviewed" : ""].filter(Boolean).join(" ");
      const statusLabel =
        s.status === "approved" ? '<span class="status approved">Approved</span>' :
        s.status === "rejected" ? '<span class="status rejected">Rejected</span>' :
        '<span class="status">Pending</span>';
      const itemCell = hideItem
        ? '<td class="is-grouped-empty">—</td>'
        : `<td><div class="item-cell"><span class="folder"></span>${escapeHtml(s.item)}</div></td>`;
      const attrCell = hideAttribute
        ? '<td class="is-grouped-empty">—</td>'
        : `<td>${escapeHtml(s.attribute)}</td>`;
      const scoreCell = hideScore
        ? '<td class="is-grouped-empty">—</td>'
        : `<td><span class="score ${scoreClass(s.score)}">${s.score}%</span></td>`;
      const statusCell = hideStatus
        ? '<td class="is-grouped-empty">—</td>'
        : `<td>${statusLabel}</td>`;
      return `
        <tr class="${rowCls}" data-suggestion-id="${s.id}">
          <td class="cell-check"><input type="checkbox" data-action="toggle-review" data-id="${s.id}" ${checked ? "checked" : ""} /></td>
          ${itemCell}
          ${attrCell}
          <td class="value-col">${escapeHtml(s.previous) || "—"}</td>
          <td class="value-col">${escapeHtml(s.newValue)}</td>
          ${scoreCell}
          <td class="reasoning">${escapeHtml(s.reasoning)}</td>
          ${statusCell}
        </tr>`;
    }

    function renderReviewTableBody(sel) {
      const mode = state.reviewGroup;
      if (!mode) {
        return suggestions.map((s) => renderReviewSuggestionRow(s, sel)).join("");
      }
      const buckets = new Map();
      suggestions.forEach((s) => {
        const key = reviewGroupKey(s, mode);
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(s);
      });
      const keys = sortReviewGroupKeys([...buckets.keys()], mode);
      const hideItem = mode === "item";
      const hideAttribute = mode === "attribute";
      const hideScore = mode === "score";
      const hideStatus = false;
      return keys.map((key) => {
        const groupItems = buckets.get(key);
        const title = reviewGroupTitle(key, mode);
        const gKey = encodeURIComponent(key);
        const selectedInGroup = groupItems.filter((s) => sel.has(s.id)).length;
        const allInGroup = selectedInGroup === groupItems.length && groupItems.length > 0;
        const header = `
          <tr class="group-row">
            <td class="cell-check">
              <input type="checkbox" data-action="toggle-review-group" data-group-key="${gKey}"
                ${allInGroup ? "checked" : ""} aria-label="Select all in group" />
            </td>
            <td colspan="7">
              <strong>${escapeHtml(title)}</strong><span class="group-meta">${groupItems.length} suggestion${groupItems.length === 1 ? "" : "s"}</span>
            </td>
          </tr>`;
        const body = groupItems
          .map((s) => renderReviewSuggestionRow(s, sel, { hideItem, hideAttribute, hideScore, hideStatus }))
          .join("");
        return header + body;
      }).join("");
    }

    function renderReviewTable() {
      const sel = state.reviewSelected;
      const { all: allReview, disabled: reviewAllDisabled } = reviewSelectAllState();
      const rows = renderReviewTableBody(sel);

      const st = stats();
      const pct = st.total ? Math.round((st.reviewed / st.total) * 100) : 0;

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="cell-check">
                  <input type="checkbox" data-action="select-all-review" aria-label="Select all suggestions" ${allReview ? "checked" : ""} ${reviewAllDisabled ? "disabled" : ""} />
                </th>
                <th>Item</th>
                <th>Attribute name</th>
                <th>Previous value</th>
                <th>New value</th>
                <th>Score</th>
                <th>Reasoning</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <footer class="table-status">${st.total} suggestions, ${sel.size} selected, ${st.reviewed} reviewed</footer>
        <footer class="review-finish-bar">
          <div class="review-finish-progress">
            <div class="progress-label"><strong>${pct}%</strong> reviewed</div>
            <div class="progress-bar"><span style="width:${pct}%"></span></div>
            <p class="finish-note">All suggestions must be approved or rejected before finishing this review.</p>
          </div>
          <button type="button" class="btn-finish" data-action="finish-review" ${st.pending ? "disabled" : ""}>Finish review</button>
        </footer>`;
    }

    function renderReviewToolbar() {
      const sel = state.reviewSelected;
      const canAct = sel.size > 0;
      const groupMenu = state.groupMenuOpen ? `
        <div class="menu-pop group-menu" role="menu">
          ${REVIEW_GROUP_OPTIONS.map((opt) => `
            <button type="button" role="menuitemradio" aria-checked="${state.reviewGroup === opt.id}"
              class="${state.reviewGroup === opt.id ? "is-active" : ""}"
              data-action="set-review-group" data-group="${opt.id}">
              <span><b>${opt.label}</b><br /><span style="font-size:12px;color:var(--muted);font-weight:400">${opt.hint}</span></span>
            </button>`).join("")}
          <div class="menu-pop-divider" role="separator"></div>
          <button type="button" role="menuitem" data-action="set-review-group" data-group=""
            ${state.reviewGroup ? "" : "disabled"}>Clear grouping</button>
        </div>` : "";
      return `
        <div class="toolbar">
          <button type="button" class="tool">${svgSort()} Sort</button>
          <button type="button" class="tool">${svgFilter()} Filter</button>
          <button type="button" class="tool${state.reviewGroup ? " is-on" : ""}" data-action="toggle-group-menu">${svgGroup()} Group${state.reviewGroup ? " · on" : ""}</button>
          ${groupMenu}
          <span class="spacer"></span>
          <button type="button" class="tool" data-action="approve" ${canAct ? "" : "disabled"}>${svgCheck()} Approve</button>
          <button type="button" class="tool" data-action="reject" ${canAct ? "" : "disabled"}>${svgX()} Reject</button>
          <div class="zoom">Zoom level <input type="range" min="0.25" max="2" step="0.25" value="0.5" /> 0.5x</div>
        </div>`;
    }

    function renderCatalogScreen() {
      const agentsMenu = state.agentsMenuOpen ? `
        <div class="menu-pop" role="menu">
          <button type="button" class="is-active" data-action="start-optimizer">${svgSparkle()} Content optimizer</button>
        </div>` : "";

      return `
        ${renderCatalogHeader()}
        <div class="workspace-row">
          <div class="workspace-main">
            <div class="toolbar">
              <button type="button" class="tool">${svgSort()} Sort</button>
              <button type="button" class="tool">${svgFilter()} Filter</button>
              <button type="button" class="tool" data-action="toggle-agents">${svgAgents()} Agents</button>
              <button type="button" class="tool">${svgPlus()} Create</button>
              <button type="button" class="tool">${svgPlus()} References</button>
              <button type="button" class="tool">${svgInspect()} Inspect</button>
              <button type="button" class="tool">${svgMore()} More</button>
              ${agentsMenu}
              <div class="zoom">Zoom level <input type="range" min="0.25" max="2" step="0.25" value="0.5" /> 0.5x</div>
              <span class="spacer"></span>
              <button type="button" class="tool">Customize</button>
              <button type="button" class="details-btn">Details</button>
            </div>
            <div class="context-band">
              <div class="tabs-row">
                <button type="button" class="tab">Tab title</button>
                <button type="button" class="tab is-on"><span class="tab-inner"><span class="tab-star">${svgStarTab()}</span> Tab title</span></button>
                <button type="button" class="tab add">+</button>
              </div>
              <div class="crumbs">Home / Breadcrumb item 1 / Breadcrumb item 2 / Breadcrumb item 3 / Last item</div>
            </div>
            <div class="main-col">${renderCatalogTable()}</div>
          </div>
          ${renderPanel()}
        </div>`;
    }

    function renderReviewScreen() {
      return `
        ${renderReviewHeader()}
        <div class="workspace-row">
          <div class="workspace-main review-screen">
            ${renderReviewToolbar()}
            <div class="main-col review-screen">${renderReviewTable()}</div>
          </div>
          ${renderPanel()}
        </div>`;
    }

    const PANEL_FEED_NEAR_BOTTOM_PX = 72;

    function capturePanelFeedScroll() {
      const feed = document.querySelector(".panel-feed");
      if (!feed) {
        state.panelFeedWasNearBottom = true;
        state.panelFeedScrollTop = 0;
        return;
      }
      const maxScroll = feed.scrollHeight - feed.clientHeight;
      state.panelFeedWasNearBottom =
        maxScroll <= 0 || maxScroll - feed.scrollTop <= PANEL_FEED_NEAR_BOTTOM_PX;
      state.panelFeedScrollTop = feed.scrollTop;
    }

    function scrollPanelFeedToLatest() {
      requestAnimationFrame(() => {
        const feed = document.querySelector(".panel-feed");
        if (!feed) return;
        if (state.panelFeedWasNearBottom) {
          feed.scrollTop = feed.scrollHeight;
        } else {
          feed.scrollTop = state.panelFeedScrollTop;
        }
      });
    }

    function focusChatInputIfNeeded() {
      if (!state.keepChatFocus) return;
      state.keepChatFocus = false;
      requestAnimationFrame(() => {
        const chat = document.getElementById("chat-input");
        if (chat) chat.focus();
      });
    }

    function render() {
      capturePanelFeedScroll();
      const app = document.getElementById("app");
      app.className = "app" + (state.view === "review" ? " screen-review" : "");
      app.innerHTML =
        (state.view === "review" ? renderReviewScreen() : renderCatalogScreen()) + renderRunLogModal();
      bindEvents();
      syncSelectAllCheckboxes();
      scrollPanelFeedToLatest();
      focusChatInputIfNeeded();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    let runTimer = null;
    let refineTimer = null;

    let singleAskingTimer = null;

    function completeSingleRun(outcome) {
      const approved = suggestions.filter((s) => s.status === "approved");
      state.writtenChanges = approved.map((s) => ({ ...s }));
      state.singleOutcome = outcome || state.singleQuestionChoice || "all";
      state.currentRun = {
        id: DEMO_RUN_ID,
        at: "just now",
        total: suggestions.length,
        product: suggestions[0]?.item,
        approvedCount: approved.length,
        written: state.writtenChanges,
      };
      state.completedRun = state.currentRun;
      state.panelPhase = "singleComplete";
      render();
    }

    function applySingleChoiceAll() {
      suggestions.forEach((s) => {
        s.status = "approved";
      });
      completeSingleRun("all");
    }

    function applySingleChoiceHigh() {
      suggestions.forEach((s) => {
        s.status = s.score >= HIGH ? "approved" : "rejected";
      });
      completeSingleRun("high");
    }

    function singleDiscardAll() {
      suggestions.forEach((s) => {
        s.status = "rejected";
      });
      state.writtenChanges = [];
      state.singleOutcome = "discard";
      state.currentRun = {
        id: DEMO_RUN_ID,
        at: "just now",
        total: suggestions.length,
        product: suggestions[0]?.item,
        approvedCount: 0,
        written: [],
      };
      state.completedRun = state.currentRun;
      state.panelPhase = "singleComplete";
      render();
    }

    function startSingleManualReview() {
      state.panelPhase = "singleManual";
      state.singleManualIndex = 0;
      if (suggestions[state.singleManualIndex]?.status !== "pending") {
        singleManualAdvance();
      }
      render();
    }

    function singleManualAdvance() {
      let idx = state.singleManualIndex;
      while (idx < suggestions.length && suggestions[idx].status !== "pending") idx++;
      if (idx >= suggestions.length) {
        completeSingleRun("manual");
        return;
      }
      state.singleManualIndex = idx;
    }

    function singleManualNext() {
      const s = suggestions[state.singleManualIndex];
      if (!s || s.status === "pending") return;
      state.singleManualIndex++;
      if (state.singleManualIndex >= suggestions.length) {
        completeSingleRun("manual");
        return;
      }
      singleManualAdvance();
      render();
    }

    function startRun(fromMenu) {
      if (state.catalogSelected.size === 0) return;
      const selected = [...state.catalogSelected];
      archiveSingleThreadIfNeeded();
      state.runMode = selected.length === 1 ? "single" : "bulk";
      const productRow = selected.length === 1 ? CATALOG_ROWS.find((r) => r.id === selected[0]) : null;
      state.lastAnalyzedCount = selected.length;
      suggestions = buildSuggestions(selected);
      state.panelOpen = true;
      state.panelPhase = "working";
      state.runStep = 0;
      state.workOpen = true;
      state.agentsMenuOpen = false;
      state.catalogSelected = new Set();
      state.chatLog = [];
      state.refineHistory = [];
      state.activeRefine = null;
      state.reviewSessionMarks = [];
      state.idleChatLog = [];
      state.completedRun = null;
      state.writtenChanges = [];
      state.singleQuestionChoice = null;
      state.singleOutcome = null;
      state.singleManualIndex = 0;
      state.singleExpandedAttrs = new Set();
      state.currentRun = {
        id: DEMO_RUN_ID,
        at: "just now",
        product: productRow?.name,
      };
      state.panelMenuOpen = false;
      state.runStepsOpen = false;
      clearTimeout(singleAskingTimer);
      render();

      clearInterval(runTimer);
      let step = 0;
      runTimer = setInterval(() => {
        step++;
        state.runStep = step;
        if (step >= RUN_STEPS.length) {
          clearInterval(runTimer);
          state.workOpen = false;
          const runStats = stats();
          if (state.runMode === "bulk") {
            state.panelPhase = "done";
            state.currentRun = {
              id: DEMO_RUN_ID,
              at: "just now",
              total: runStats.total,
              ready: runStats.ready,
              attention: runStats.attention,
            };
            render();
          } else {
            state.panelPhase = "singleAsking";
            state.currentRun = {
              id: DEMO_RUN_ID,
              at: "just now",
              total: runStats.total,
              product: productRow?.name,
              ready: runStats.ready,
              attention: runStats.attention,
            };
            render();
            singleAskingTimer = setTimeout(() => {
              if (state.panelPhase === "singleAsking") {
                state.panelPhase = "singleQuestions";
                render();
              }
            }, 900);
          }
          return;
        }
        render();
      }, fromMenu ? 900 : 900);
    }

    function openReview() {
      const resuming = state.panelPhase === "reviewPaused";
      state.view = "review";
      state.panelPhase = "reviewing";
      if (!resuming) {
        state.reviewSelected = new Set();
        state.refineHistory = [];
        state.activeRefine = null;
        state.reviewGroup = null;
        state.reviewSessionMarks = [{ type: "started", afterRefineIndex: 0 }];
      } else {
        state.reviewSessionMarks.push({
          type: "resumed",
          afterRefineIndex: state.refineHistory.length,
        });
      }
      state.groupMenuOpen = false;
      state.summaryOpen = false;
      state.panelMenuOpen = false;
      render();
    }

    function pauseReview() {
      if (state.view !== "review" || state.panelPhase !== "reviewing") return;
      if (state.activeRefine) {
        clearInterval(refineTimer);
        state.activeRefine = null;
      }
      state.view = "catalog";
      state.panelPhase = "reviewPaused";
      state.reviewSelected = new Set();
      state.reviewSessionMarks.push({
        type: "paused",
        afterRefineIndex: state.refineHistory.length,
        detail: pauseDetailText(),
      });
      state.groupMenuOpen = false;
      state.panelMenuOpen = false;
      render();
    }

    function finishReview() {
      const st = stats();
      if (st.pending) return;
      const approved = suggestions.filter((s) => s.status === "approved");
      state.writtenChanges = approved.map((s) => ({ ...s }));
      state.completedRun = {
        id: DEMO_RUN_ID,
        at: "just now",
        total: st.total,
        approvedCount: approved.length,
        ready: state.currentRun?.ready ?? 0,
        attention: state.currentRun?.attention ?? 0,
        written: state.writtenChanges,
      };
      state.currentRun = state.completedRun;
      state.view = "catalog";
      state.panelPhase = "complete";
      state.reviewSelected = new Set();
      suggestions = [];
      state.catalogSelected = new Set();
      render();
    }

    function openRunLog() {
      state.runLogOpen = true;
      state.panelMenuOpen = false;
      render();
    }

    function closeRunLog() {
      state.runLogOpen = false;
      render();
    }

    function applyDecision(decision) {
      state.reviewSelected.forEach((id) => {
        const s = suggestions.find((x) => x.id === id);
        if (s) s.status = decision;
      });
      state.reviewSelected.clear();
      render();
    }

    function setReviewGroupSelection(groupKey, selected) {
      suggestionsInReviewGroup(groupKey).forEach((s) => {
        if (selected) state.reviewSelected.add(s.id);
        else state.reviewSelected.delete(s.id);
      });
      render();
    }

    function syncReviewGroupCheckboxes() {
      document.querySelectorAll("[data-action=toggle-review-group]").forEach((el) => {
        const groupKey = decodeURIComponent(el.getAttribute("data-group-key") || "");
        const items = suggestionsInReviewGroup(groupKey);
        const n = items.filter((s) => state.reviewSelected.has(s.id)).length;
        el.checked = n === items.length && items.length > 0;
        el.indeterminate = n > 0 && n < items.length;
      });
    }

    function refineReplyFor(prompt, count) {
      const lower = prompt.toLowerCase();
      if (lower.includes("short")) {
        return `Done. Shortened ${count} suggestion${count === 1 ? "" : "s"}. They’re still pending your approval.`;
      }
      return `Done. Updated ${count} suggestion${count === 1 ? "" : "s"} based on your instructions. They’re still pending your approval.`;
    }

    function applyRefineToSuggestions(ids, prompt) {
      const shorter = prompt.toLowerCase().includes("short");
      ids.forEach((id) => {
        const s = suggestions.find((x) => x.id === id);
        if (!s) return;
        if (shorter) {
          const words = s.newValue.replace(/\s+/g, " ").trim().split(" ");
          s.newValue = words.slice(0, Math.max(4, Math.ceil(words.length * 0.65))).join(" ").replace(/\.$/, "") + ".";
        } else {
          s.newValue = s.newValue.replace(/\.$/, "") + " — refined per your instructions.";
        }
        s.score = Math.min(99, s.score + 4);
        s.reasoning = "Updated after refinement: " + prompt.slice(0, 80) + (prompt.length > 80 ? "…" : "");
        s.status = "pending";
      });
    }

    function sendPanelMessage() {
      if (state.panelPhase === "idle") {
        const text = state.chatDraft.trim();
        if (!text) return;
        if (isRunCommand(text)) {
          state.chatDraft = "";
          state.keepChatFocus = true;
          if (state.catalogSelected.size === 0) {
            state.idleChatLog.push({
              prompt: text,
              reply: "Select one or more products in the table, then type run or choose Run agent.",
            });
            render();
            return;
          }
          startRun(false);
          return;
        }
        state.chatDraft = "";
        state.idleChatLog.push({
          prompt: text,
          reply:
            "Select products in the table, then type run or choose Run agent to start Content optimizer.",
        });
        state.keepChatFocus = true;
        render();
        return;
      }
      sendRefine();
    }

    function sendRefine() {
      const text = state.chatDraft.trim();
      if (!text || (!canRefineInPanel() && !canChatWhilePaused())) return;

      if (canChatWhilePaused() && !canRefineInPanel()) {
        state.chatDraft = "";
        state.refineHistory.push({
          prompt: text,
          reply:
            "Noted. Open Continue review, select the suggestions you want to change, then send your instructions again.",
        });
        state.keepChatFocus = true;
        render();
        return;
      }

      let ids;
      if (isSinglePanelPhase()) {
        ids = suggestions.filter((s) => s.status === "pending").map((s) => s.id);
      } else {
        ids = [...state.reviewSelected].filter((id) => {
          const s = suggestions.find((x) => x.id === id);
          return s && s.status === "pending";
        });
      }
      if (!ids.length) return;

      state.chatDraft = "";
      state.activeRefine = { prompt: text, step: 0, ids };
      state.keepChatFocus = true;
      render();

      clearInterval(refineTimer);
      let step = 0;
      refineTimer = setInterval(() => {
        step++;
        if (!state.activeRefine) {
          clearInterval(refineTimer);
          return;
        }
        state.activeRefine.step = step;
        if (step >= REFINE_STEPS.length) {
          clearInterval(refineTimer);
          const active = state.activeRefine;
          applyRefineToSuggestions(active.ids, active.prompt);
          state.refineHistory.push({
            prompt: active.prompt,
            reply: refineReplyFor(active.prompt, active.ids.length),
          });
          state.activeRefine = null;
          state.keepChatFocus = true;
        }
        render();
      }, 750);
    }

    function bindEvents() {
      document.querySelector("[data-action=toggle-agents]")?.addEventListener("click", (e) => {
        e.stopPropagation();
        if (state.view !== "catalog") return;
        state.agentsMenuOpen = !state.agentsMenuOpen;
        render();
      });
      document.querySelector(".menu-pop")?.addEventListener("click", (e) => e.stopPropagation());
      document.querySelector("[data-action=start-optimizer]")?.addEventListener("click", () => {
        startRun(true);
      });
      document.querySelector("[data-action=open-assistant]")?.addEventListener("click", toggleAssistantPanel);
      document.querySelectorAll("[data-action=run-agent]").forEach((el) => {
        el.addEventListener("click", () => startRun(false));
      });
      document.querySelector("[data-action=toggle-summary]")?.addEventListener("click", () => {
        state.summaryOpen = !state.summaryOpen;
        render();
      });
      document.querySelector("[data-action=open-review]")?.addEventListener("click", () => {
        if (state.runMode === "bulk") openReview();
      });
      document.querySelectorAll("[data-action=toggle-single-attr]").forEach((el) => {
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-id");
          if (state.singleExpandedAttrs.has(id)) state.singleExpandedAttrs.delete(id);
          else state.singleExpandedAttrs.add(id);
          render();
        });
      });
      document.querySelectorAll("[data-action=set-single-choice]").forEach((el) => {
        el.addEventListener("change", () => {
          if (!el.checked) return;
          state.singleQuestionChoice = el.getAttribute("data-choice");
          render();
        });
      });
      document.querySelector("[data-action=single-discard-all]")?.addEventListener("click", singleDiscardAll);
      document.querySelector("[data-action=single-primary]")?.addEventListener("click", () => {
        const c = state.singleQuestionChoice;
        if (c === "all") applySingleChoiceAll();
        else if (c === "high") applySingleChoiceHigh();
        else if (c === "manual") startSingleManualReview();
      });
      document.querySelectorAll("[data-action=single-manual-decide]").forEach((el) => {
        el.addEventListener("click", () => {
          const decision = el.getAttribute("data-decision");
          const s = suggestions[state.singleManualIndex];
          if (s) s.status = decision;
          render();
        });
      });
      document.querySelector("[data-action=single-manual-next]")?.addEventListener("click", singleManualNext);
      document.querySelector("[data-action=single-refine-focus]")?.addEventListener("click", () => {
        state.keepChatFocus = true;
        render();
      });
      document.querySelectorAll("[data-action=open-run-log]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          openRunLog();
        });
      });
      document.querySelectorAll("[data-action=close-run-log]").forEach((el) => {
        el.addEventListener("click", closeRunLog);
      });
      document.querySelector("[data-action=close-run-log-scrim]")?.addEventListener("click", (e) => {
        if (e.target.matches("[data-action=close-run-log-scrim]")) closeRunLog();
      });
      document.querySelector("[data-action=stop]")?.addEventListener("click", (e) => e.stopPropagation());
      document.querySelector("[data-action=toggle-panel-menu]")?.addEventListener("click", (e) => {
        e.stopPropagation();
        state.panelMenuOpen = !state.panelMenuOpen;
        render();
      });
      document.querySelector("[data-action=close-panel-menu]")?.addEventListener("click", () => {
        state.panelMenuOpen = false;
        render();
      });
      document.querySelector("[data-action=toggle-run-steps]")?.addEventListener("click", () => {
        state.runStepsOpen = !state.runStepsOpen;
        render();
      });
      document.querySelector("[data-action=back-catalog]")?.addEventListener("click", pauseReview);
      document.querySelector(".group-menu")?.addEventListener("click", (e) => e.stopPropagation());
      document.querySelector("[data-action=toggle-group-menu]")?.addEventListener("click", (e) => {
        e.stopPropagation();
        state.groupMenuOpen = !state.groupMenuOpen;
        render();
      });
      document.querySelectorAll("[data-action=set-review-group]").forEach((el) => {
        el.addEventListener("click", () => {
          const value = el.getAttribute("data-group");
          state.reviewGroup = value || null;
          state.groupMenuOpen = false;
          render();
        });
      });
      document.querySelector("[data-action=approve]")?.addEventListener("click", () => applyDecision("approved"));
      document.querySelector("[data-action=reject]")?.addEventListener("click", () => applyDecision("rejected"));
      document.querySelector("[data-action=finish-review]")?.addEventListener("click", finishReview);
      document.querySelector("[data-action=send-panel-message]")?.addEventListener("click", sendPanelMessage);

      document.querySelector("[data-action=select-all-catalog]")?.addEventListener("change", (e) => {
        if (e.target.checked) {
          state.catalogSelected = new Set(CATALOG_ROWS.map((r) => r.id));
        } else {
          state.catalogSelected = new Set();
        }
        render();
      });

      document.querySelector("[data-action=select-all-review]")?.addEventListener("change", (e) => {
        if (e.target.checked) {
          suggestions.forEach((s) => state.reviewSelected.add(s.id));
        } else {
          state.reviewSelected.clear();
        }
        render();
      });

      document.querySelectorAll("[data-action=toggle-catalog]").forEach((el) => {
        el.addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-id");
          if (e.target.checked) state.catalogSelected.add(id);
          else state.catalogSelected.delete(id);
          render();
        });
      });

      document.querySelectorAll("[data-action=toggle-review]").forEach((el) => {
        el.addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-id");
          if (e.target.checked) state.reviewSelected.add(id);
          else state.reviewSelected.delete(id);
          render();
        });
      });

      document.querySelectorAll("[data-action=toggle-review-group]").forEach((el) => {
        el.addEventListener("change", (e) => {
          const groupKey = decodeURIComponent(e.target.getAttribute("data-group-key") || "");
          setReviewGroupSelection(groupKey, e.target.checked);
        });
      });
      syncReviewGroupCheckboxes();

      const chat = document.getElementById("chat-input");
      if (chat) {
        chat.addEventListener("input", (e) => {
          state.chatDraft = e.target.value;
          const send = document.querySelector("[data-action=send-panel-message]");
          if (send) send.disabled = !canSendPanelMessage();
        });
        chat.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendPanelMessage();
          }
        });
      }
    }

    document.addEventListener("click", () => {
      let rerender = false;
      if (state.agentsMenuOpen) {
        state.agentsMenuOpen = false;
        rerender = true;
      }
      if (state.panelMenuOpen) {
        state.panelMenuOpen = false;
        rerender = true;
      }
      if (state.groupMenuOpen) {
        state.groupMenuOpen = false;
        rerender = true;
      }
      if (rerender) render();
    });

    render();
  </script>
</body>
</html>
